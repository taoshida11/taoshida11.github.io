# Welcome to Jekyll!
# 极简纯净版配置，删除所有冗余功能，仅保留个人主页基础展示

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default"
title                    : "Shida Tao"
title_separator          : "-"
name                     : &name "陶士达"
description              : &description "Shida Tao's academic homepage, VIPL, Institute of Computing Technology, CAS. Research on embodied AI."
url                      : "https://taoshida11.github.io"
baseurl                  : ""
repository               : "taoshida11/taoshida11.github.io"

# 【核心个人信息 - 已全部填好你的信息】
author:
  avatar           : "profile.png"
  name             : "Shida Tao 陶士达"
  pronouns         : "he/him"
  bio              : "Master student at VIPL, Institute of Computing Technology, Chinese Academy of Sciences. Research interests: embodied AI, robot navigation and reinforcement learning."
  location         : "Beijing, China"
  employer         : "VIPL, Institute of Computing Technology, Chinese Academy of Sciences"
  email            : "your.email@example.com"
  github           : "taoshida11"

# 全部关闭多余学术链接（不需要论文/谷歌学术等）
googlescholar    : ""
orcid            : ""
researchgate     : ""
pubmed           : ""

# Site Settings（极简关闭所有多余功能）
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false

# 关闭评论系统
comments:
  provider               : false

# 关闭订阅
atom_feed:
  hide                   : true

# SEO 留空
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# 社交分享全部关闭
twitter:
  username               :
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 :
og_description           :
social:
  type                   :
  name                   :
  links: []

# 关闭统计
analytics:
  provider               : "false"

# 文件读写规则
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# 基础编译设置
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# 页面默认布局（极简、无多余栏目）
collections:
  teaching:
    output: false
  publications:
    output: false
  portfolio:
    output: false
  talks:
    output: false

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: false
      comments: false
      share: false
      related: false
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# 样式压缩
sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Asia/Shanghai

# 仅保留必备插件，删掉所有报错/冗余插件
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# 关闭所有归档功能
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML 压缩
compress_html:
  clippings: all
  ignore:
    envs: development
